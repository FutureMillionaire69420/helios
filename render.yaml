services:
  - type: web
    name: decu-copybot
    runtime: node
    plan: starter
    rootDir: computer
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: bot-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DRY_RUN
        value: "true"
      - key: HELIUS_API_KEY
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: ENGINE_STATE_FILE
        value: /var/data/engine-paper.json
      - key: STATE_FILE
        value: /var/data/state.json
      - key: LOG_FILE
        value: /var/data/trades.log
      - key: SIZING_MODE
        value: fixed
      - key: AUTO_SELL
        value: "false"
      - key: BUY_SOL
        value: "0.1"
      - key: MAX_BUY_SOL
        value: "0.1"
      - key: DAILY_CAP_SOL
        value: "1"
      - key: SLIPPAGE_PCT
        value: "20"
      - key: NTFY_TOPIC
        sync: false
